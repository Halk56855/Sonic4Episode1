name: Build Sonic 4 APK

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: false

    - name: Init and Update Submodules safely
      run: |
        git submodule update --init --recursive || true

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install .NET Android Workload & MonoGame Templates
      run: |
        dotnet workload install android
        dotnet new install MonoGame.Templates.CSharp

    - name: Create Unified Android Project & Force net8.0-android
      run: |
        # إنشاء مشروع أندرويد جديد
        dotnet new mgandroid -n Sonic4Episode1.Android

        # نسخ ملفات الكود والمحتوى إلى داخل مشروع الأندرويد
        cp -r Sonic4Episode1/*.cs Sonic4Episode1.Android/ || true
        if [ -d "Sonic4Episode1/Content" ]; then
          cp -r Sonic4Episode1/Content Sonic4Episode1.Android/
        fi

        # تعديل إطار العمل مباشرة في مشروع الأندرويد ليكون net8.0-android مع حقن خصائص تعطيل فحص EOL
        python3 -c "
        path = 'Sonic4Episode1.Android/Sonic4Episode1.Android.csproj'
        with open(path, 'r', encoding='utf-8') as f:
            content = f.read()
        
        # استبدال net9.0-android أو أي إطار آخر بـ net8.0-android المتوافق مع .NET 8
        content = content.replace('<TargetFramework>net9.0-android</TargetFramework>', '<TargetFramework>net8.0-android</TargetFramework>')
        content = content.replace('<TargetFrameworks>net9.0-android</TargetFrameworks>', '<TargetFrameworks>net8.0-android</TargetFrameworks>')
        
        # حقن خصائص إيقاف التحقق من انتهاء الدعم داخل PropertyGroup
        content = content.replace('<PropertyGroup>', '<PropertyGroup>\n    <CheckEolTargetFramework>false</CheckEolTargetFramework>\n    <SuppressOutOfSupportTargetFrameworkError>true</SuppressOutOfSupportTargetFrameworkError>')
        
        with open(path, 'w', encoding='utf-8') as f:
            f.write(content)
        print('Forced net8.0-android and disabled EOL checks successfully.')
        " || true

    - name: Restore and Build APK
      run: |
        dotnet publish Sonic4Episode1.Android/Sonic4Episode1.Android.csproj -c Release -p:AndroidPackageFormat=apk -p:CheckEolTargetFramework=false -p:SuppressOutOfSupportTargetFrameworkError=true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sonic4-APK
        path: |
          **/*.apk

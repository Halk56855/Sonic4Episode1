name: Build Sonic 4 APK

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: false

    - name: Init and Update Submodules safely
      run: |
        git submodule update --init --recursive || true

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install .NET Android Workload & MonoGame Templates
      run: |
        dotnet workload install android
        dotnet new install MonoGame.Templates.CSharp

    - name: Create Unified Android Project & Fix Frameworks
      run: |
        # إنشاء مشروع أندرويد جديد
        dotnet new mgandroid -n Sonic4Episode1.Android

        # نسخ ملفات الكود والمحتوى إلى داخل مشروع الأندرويد
        cp -r Sonic4Episode1/*.cs Sonic4Episode1.Android/ || true
        if [ -d "Sonic4Episode1/Content" ]; then
          cp -r Sonic4Episode1/Content Sonic4Episode1.Android/
        fi

        # تجاوز منع إطارات العمل المنتهية لدعم البناء تحت .NET 10/11
        python3 -c "
        path = 'Sonic4Episode1.Android/Sonic4Episode1.Android.csproj'
        with open(path, 'r', encoding='utf-8') as f:
            content = f.read()
        
        # تعطيل فحص انتهاء دعم الإطار المستهدف وإضافته صراحة لمنع الخطأ
        content = content.replace('net9.0-android', 'net8.0-android')
        with open(path, 'w', encoding='utf-8') as f:
            f.write(content)
        print('Updated Android project framework.')
        " || true

    - name: Restore and Build APK
      run: |
        dotnet publish Sonic4Episode1.Android/Sonic4Episode1.Android.csproj -c Release -p:AndroidPackageFormat=apk -p:CheckEolTargetFramework=false -p:CheckNotAllowedTargetFrameworks=false

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sonic4-APK
        path: |
          **/*.apk

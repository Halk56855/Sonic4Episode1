name: Build Sonic 4 APK

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: false

    - name: Init and Update Submodules safely
      run: |
        git submodule update --init --recursive || true

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install .NET Android Workload & MonoGame Templates
      run: |
        dotnet workload install android
        dotnet new install MonoGame.Templates.CSharp

    - name: Create Android Project & Fix Framework Compatibility
      run: |
        # إنشاء مشروع الأندرويد
        dotnet new mgandroid -n Sonic4Episode1.Android

        # تعديل ملف Sonic4Episode1.csproj بالنصوص المباشرة لإضافة net9.0-android بضمان تام
        python3 -c "
        path = 'Sonic4Episode1/Sonic4Episode1.csproj'
        with open(path, 'r', encoding='utf-8') as f:
            content = f.read()

        if '<TargetFrameworks>' in content:
            if 'net9.0-android' not in content:
                content = content.replace('</TargetFrameworks>', ';net9.0-android</TargetFrameworks>')
        elif '<TargetFramework>' in content:
            import re
            match = re.search(r'<TargetFramework>(.*?)</TargetFramework>', content)
            if match:
                old_tf = match.group(1)
                new_tfs = f'<TargetFrameworks>{old_tf};net9.0-android</TargetFrameworks>'
                content = content.replace(match.group(0), new_tfs)

        with open(path, 'w', encoding='utf-8') as f:
            f.write(content)
        print('Successfully updated Sonic4Episode1.csproj target frameworks.')
        "

        # ربط المشروعين بعد التعديل الناجح
        dotnet add Sonic4Episode1.Android/Sonic4Episode1.Android.csproj reference Sonic4Episode1/Sonic4Episode1.csproj

    - name: Restore and Build APK
      run: |
        dotnet publish Sonic4Episode1.Android/Sonic4Episode1.Android.csproj -c Release -p:AndroidPackageFormat=apk -p:CheckEolTargetFramework=false

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sonic4-APK
        path: |
          **/*.apk

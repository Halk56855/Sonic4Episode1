name: Build Sonic 4 APK

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: false

    - name: Init and Update Submodules safely
      run: |
        git submodule update --init --recursive || true

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install .NET Android Workload & MonoGame Templates
      run: |
        dotnet workload install android
        dotnet new install MonoGame.Templates.CSharp

    - name: Create Android Project & Fix Framework Compatibility
      run: |
        # إنشاء مشروع الأندرويد
        dotnet new mgandroid -n Sonic4Episode1.Android

        # استخدام بايثون أو سكربت بسيط لتحديث ملف Sonic4Episode1.csproj ليدعم net9.0-android بصمان تام
        python3 -c "
        import xml.etree.ElementTree as ET
        ET.register_namespace('', 'http://schemas.microsoft.com/developer/msbuild/2003')
        tree = ET.parse('Sonic4Episode1/Sonic4Episode1.csproj')
        root = tree.getroot()
        for prop_group in root.findall('{http://schemas.microsoft.com/developer/msbuild/2003}PropertyGroup'):
            tf = prop_group.find('{http://schemas.microsoft.com/developer/msbuild/2003}TargetFramework')
            tfs = prop_group.find('{http://schemas.microsoft.com/developer/msbuild/2003}TargetFrameworks')
            if tf is not None:
                tf.tag = 'TargetFrameworks'
                tf.text = tf.text + ';net9.0-android'
                break
            elif tfs is not None:
                if 'net9.0-android' not in tfs.text:
                    tfs.text += ';net9.0-android'
                break
        tree.write('Sonic4Episode1/Sonic4Episode1.csproj', encoding='utf-8', xml_declaration=True)
        " || true

        # ربط المشروعين بعد التعديل
        dotnet add Sonic4Episode1.Android/Sonic4Episode1.Android.csproj reference Sonic4Episode1/Sonic4Episode1.csproj

    - name: Restore and Build APK
      run: |
        dotnet publish Sonic4Episode1.Android/Sonic4Episode1.Android.csproj -c Release -p:AndroidPackageFormat=apk -p:CheckEolTargetFramework=false

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sonic4-APK
        path: |
          **/*.apk

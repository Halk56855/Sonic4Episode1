name: Build Sonic 4 APK

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: false

    - name: Init and Update Submodules safely
      run: |
        git submodule update --init --recursive || true

    - name: Create global.json to lock .NET 8 SDK
      run: |
        echo '{
          "sdk": {
            "version": "8.0.400",
            "rollForward": "latestPatch"
          }
        }' > global.json

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        global-json-file: 'global.json'

    - name: Install .NET Android Workload & MonoGame Templates
      run: |
        dotnet workload restore
        dotnet workload install android --skip-manifest-update
        dotnet new install MonoGame.Templates.CSharp

    - name: Create Android Project & Reference Game Correctly
      run: |
        # إنشاء مشروع أندرويد نظيف ومنفصل
        dotnet new mgandroid -n Sonic4Episode1.Android

        # تعديل إطار العمل في مشروع الأندرويد ليكون net8.0-android وحقن إيقاف فحص EOL
        python3 -c "
        path = 'Sonic4Episode1.Android/Sonic4Episode1.Android.csproj'
        with open(path, 'r', encoding='utf-8') as f:
            content = f.read()
        
        content = content.replace('<TargetFramework>net9.0-android</TargetFramework>', '<TargetFramework>net8.0-android</TargetFramework>')
        content = content.replace('<TargetFrameworks>net9.0-android</TargetFrameworks>', '<TargetFrameworks>net8.0-android</TargetFrameworks>')
        content = content.replace('<PropertyGroup>', '<PropertyGroup>\n    <CheckEolTargetFramework>false</CheckEolTargetFramework>\n    <SuppressOutOfSupportTargetFrameworkError>true</SuppressOutOfSupportTargetFrameworkError>')
        
        with open(path, 'w', encoding='utf-8') as f:
            f.write(content)
        " || true

        # تحويل مشروع اللعبة الأساسي ليدعم netstandard2.0 لكي يقبله الأندرويد كمرجع
        python3 -c "
        path = 'Sonic4Episode1/Sonic4Episode1.csproj'
        with open(path, 'r', encoding='utf-8') as f:
            content = f.read()
        
        import re
        content = re.sub(r'<TargetFrameworks?>.*?</TargetFrameworks?>', '<TargetFramework>netstandard2.0</TargetFramework>', content, flags=re.DOTALL)
        
        with open(path, 'w', encoding='utf-8') as f:
            f.write(content)
        " || true

        # ربط المشروعين بعد تفعيل حزمة أندرويد
        dotnet add Sonic4Episode1.Android/Sonic4Episode1.Android.csproj reference Sonic4Episode1/Sonic4Episode1.csproj

    - name: Restore and Build APK
      run: |
        dotnet publish Sonic4Episode1.Android/Sonic4Episode1.Android.csproj -c Release -p:AndroidPackageFormat=apk -p:CheckEolTargetFramework=false -p:SuppressOutOfSupportTargetFrameworkError=true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sonic4-APK
        path: |
          **/*.apk

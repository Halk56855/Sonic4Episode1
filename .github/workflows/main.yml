name: Build Sonic 4 APK

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: false

    - name: Init and Update Submodules safely
      run: |
        git submodule update --init --recursive || true

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install .NET Android Workload & MonoGame Templates
      run: |
        dotnet workload install android
        dotnet new install MonoGame.Templates.CSharp

    - name: Create Unified Android Project & Copy Game Files
      run: |
        # إنشاء مشروع أندرويد جديد
        dotnet new mgandroid -n Sonic4Episode1.Android

        # نسخ ملفات الكود الخاصة باللعبة (.cs) إلى داخل مشروع الأندرويد ليتم تجميعها مباشرة
        cp -r Sonic4Episode1/*.cs Sonic4Episode1.Android/ || true

        # إذا كان هناك مجلد Content للعبة، قم بنسخه أيضاً
        if [ -d "Sonic4Episode1/Content" ]; then
          cp -r Sonic4Episode1/Content Sonic4Episode1.Android/
        fi

    - name: Restore and Build APK
      run: |
        dotnet publish Sonic4Episode1.Android/Sonic4Episode1.Android.csproj -c Release -p:AndroidPackageFormat=apk -p:CheckEolTargetFramework=false

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sonic4-APK
        path: |
          **/*.apk

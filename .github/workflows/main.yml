name: Build Sonic 4 APK

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: false

    - name: Init and Update Submodules safely
      run: |
        git submodule update --init --recursive || true

    - name: Create global.json to lock .NET 8 SDK
      run: |
        echo '{
          "sdk": {
            "version": "8.0.400",
            "rollForward": "latestPatch"
          }
        }' > global.json

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        global-json-file: 'global.json'

    - name: Install .NET Android Workload & MonoGame Templates
      run: |
        dotnet workload install android --skip-manifest-update

    - name: Create Android Project, Manifest & Force netstandard2.0 on Game
      run: |
        # إنشاء مجلد مشروع الأندرويد
        mkdir -p Sonic4Episode1.Android

        # كتابة ملف مشروع الأندرويد يدوياً بصيغة نظيفة ومتوافقة تماماً مع .NET 8 و MonoGame
        cat << 'EOF' > Sonic4Episode1.Android/Sonic4Episode1.Android.csproj
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net8.0-android</TargetFramework>
            <OutputType>Exe</OutputType>
            <SupportedOSPlatformVersion>21.0</SupportedOSPlatformVersion>
            <ApplicationId>com.sega.sonic4eps1</ApplicationId>
            <ApplicationVersion>1</ApplicationVersion>
            <ApplicationDisplayVersion>1.0</ApplicationDisplayVersion>
            <CheckEolTargetFramework>false</CheckEolTargetFramework>
            <SuppressOutOfSupportTargetFrameworkError>true</SuppressOutOfSupportTargetFrameworkError>
          </PropertyGroup>
          <ItemGroup>
            <PackageReference Include="MonoGame.Framework.Android" Version="3.8.2.1105" />
          </ItemGroup>
          <ItemGroup>
            <ProjectReference Include="..\Sonic4Episode1\Sonic4Episode1.csproj" />
          </ItemGroup>
        </Project>
        EOF

        # إنشاء ملف AndroidManifest.xml الأساسي
        cat << 'EOF' > Sonic4Episode1.Android/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:allowBackup="true" android:label="Sonic 4 Episode I" android:supportsRtl="true">
            </application>
        </manifest>
        EOF

        # تنظيف وتحويل مشروع اللعبة الأساسي سطرًا بسطر لإزالة أي أثر لـ v4.7.2 وإجبار netstandard2.0
        python3 -c "
        path = 'Sonic4Episode1/Sonic4Episode1.csproj'
        with open(path, 'r', encoding='utf-8') as f:
            lines = f.readlines()
        
        new_lines = []
        target_added = False

        for line in lines:
            # تجاهل أي سطر يحتوي على إطارات عمل قديمة
            if any(k in line for k in ['TargetFrameworkVersion', '<TargetFramework>', '<TargetFrameworks>']):
                continue
            
            new_lines.append(line)
            
            # حقن netstandard2.0 في أول PropertyGroup تظهر
            if '<PropertyGroup>' in line and not target_added:
                new_lines.append('    <TargetFramework>netstandard2.0</TargetFramework>\n')
                target_added = True

        with open(path, 'w', encoding='utf-8') as f:
            f.writelines(new_lines)
        print('Successfully purged old frameworks and set netstandard2.0')
        "

    - name: Restore and Build APK
      run: |
        dotnet publish Sonic4Episode1.Android/Sonic4Episode1.Android.csproj -c Release -p:AndroidPackageFormat=apk -p:CheckEolTargetFramework=false -p:SuppressOutOfSupportTargetFrameworkError=true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sonic4-APK
        path: |
          **/*.apk
